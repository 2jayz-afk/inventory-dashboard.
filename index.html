<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Inventory Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="dashboard">
    <header class="hero">
      <div>
        <p class="eyebrow">Inventory Management</p>
        <h1>Product Inventory Dashboard</h1>
        <p class="subtitle">
          Search, filter, and monitor your current product inventory.
        </p>
      </div>
    </header>

    <section class="controls" aria-label="Product controls">
      <div class="field">
        <label for="searchInput">Search Products</label>
        <input
          id="searchInput"
          type="text"
          placeholder="Enter product name"
        >
      </div>

      <div class="field">
        <label for="categoryFilter">Category</label>
        <select id="categoryFilter">
          <option value="All">All</option>
          <option value="Accessories">Accessories</option>
          <option value="Displays">Displays</option>
          <option value="Storage">Storage</option>
          <option value="Components">Components</option>
        </select>
      </div>

      <div class="actions">
        <button id="searchBtn" type="button">Search</button>
        <button id="resetBtn" type="button" class="secondary">Reset</button>
      </div>
    </section>

    <section class="summary" aria-label="Inventory summary">
      <article class="summary-card">
        <span>Total Inventory Value</span>
        <strong id="totalInventoryValue">₱0</strong>
      </article>

      <article class="summary-card">
        <span>Low-Stock Products</span>
        <strong id="lowStockCount">0</strong>
      </article>

      <article class="summary-card">
        <span>Out-of-Stock Products</span>
        <strong id="outOfStockCount">0</strong>
      </article>
    </section>

    <section class="products-section">
      <div class="section-heading">
        <h2>Products</h2>
      </div>

      <p id="noResultsMessage" class="no-results" hidden>
        No products found
      </p>

      <div id="productList" class="product-list"></div>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
